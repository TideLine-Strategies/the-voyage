name: Check Voyage Worker

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx --yes npm@11 ci --prefix prototypes/content-factory --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck --prefix prototypes/content-factory
      - run: npm test --prefix prototypes/content-factory
      - run: npm run build:live --prefix prototypes/content-factory
      - run: git diff --exit-code -- public/factory
